<body class="backpacker-page">

    <nav class="main-nav" id="mainNav">
        <div class="nav-brand dropdown" id="navBrand">

            <div class="dropdown-menu" id="languageMenu">
                <a href="#" class="dropdown-item" data-lang="en" data-name="PETER">PETER</a>
                <a href="#" class="dropdown-item" data-lang="es" data-name="PEDRO">PEDRO</a>

                <a href="#" class="dropdown-item" data-lang="zh" data-name="皮特">皮特</a>
            </div>
        </div>
        <div class="nav-links">

            <div class="nav-item">

            <div class="nav-item">

                    <p data-i18n="backpacker.description"></p>
