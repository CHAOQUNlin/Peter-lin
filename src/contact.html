    <script>
        if (typeof LanguageManager !== 'undefined') {
            LanguageManager.init();
        }

        document.addEventListener('DOMContentLoaded', () => {
            bindHaramLink();
        });

        function bindHaramLink() {
            const haramLink = document.querySelector('[data-haram="true"]');
            if (!haramLink) {
                return;
            }

            haramLink.addEventListener('click', (event) => {
                event.preventDefault();
                alert('Haram!');
